[package]
# Profiles built on obex-protocol are named `obex-protocol-<profile>`.
name = "obex-protocol-map"
version = "0.2.0"
authors = ["Ian Armour <ianmarmour@gmail.com>"]
description = """
Bluetooth Message Access Profile (MAP) 1.4 implementation in Rust, built on obex-protocol.
"""
edition = "2021"
rust-version = "1.85"
readme = "README.md"
repository = "https://github.com/ianmarmour/obex-protocol-map"
license = "MIT"
keywords = ["map", "bluetooth", "obex", "sms", "messaging"]
categories = ["encoding", "network-programming", "no-std", "embedded"]
# The specification is copyrighted by the Bluetooth SIG, so it stays out of the package.
exclude = ["docs/", ".github/"]

[lib]
path = "src/lib.rs"

[features]
default = ["std"]
# The blocking clients and servers in `client` and `server`. Without it the crate
# is `no_std` and needs only `alloc`.
std = ["obex-protocol/std"]
# Async clients, servers and handlers for tokio, in `obex_protocol_map::tokio`.
tokio = ["std", "obex-protocol/tokio", "dep:tokio"]
# Async clients, servers and handlers over `embedded-io-async`, in
# `obex_protocol_map::embedded`, for embedded devices; works without `std`.
embedded-io-async = ["obex-protocol/embedded-io-async", "dep:embedded-io-async"]

[dependencies]
embedded-io-async = { version = "0.7", optional = true }
obex-protocol = { version = "0.2", default-features = false }
tokio = { version = "1", optional = true, default-features = false }

[dev-dependencies]
embedded-io-adapters = { version = "0.7", features = ["tokio-1"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[[example]]
name = "loopback"
required-features = ["std"]

[package.metadata.docs.rs]
all-features = true
